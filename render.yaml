services:
  - type: web
    name: twinkle-showroom
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        value: twinkle2024
      - key: DB_PATH
        value: /opt/render/project/src/db.json
